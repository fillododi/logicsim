# Levels in unlock order. `parts` lists the chips each level may use.

# The tutorial: the guide bubbles in tutorial.toml walk through it. Not doesn't
# need it, so a player can skip straight to the gates. Wire teaches connections,
# Hello teaches parts.
[[level]]
name = "Wire"
group = "00_tutorial"
parts = []

[[level]]
name = "Hello"
group = "00_tutorial"
parts = ["Nand"]

[[level]]
name = "Not"
group = "01_gates"
parts = ["Nand"]

[[level]]
name = "And"
group = "01_gates"
parts = ["Nand", "Not"]

[[level]]
name = "Or"
group = "01_gates"
parts = ["Nand", "Not", "And"]

[[level]]
name = "Xor"
group = "01_gates"
parts = ["Nand", "Not", "And", "Or"]

[[level]]
name = "Mux"
group = "01_gates"
parts = ["Nand", "Not", "And", "Or", "Xor"]

[[level]]
name = "DMux"
group = "01_gates"
parts = ["Nand", "Not", "And", "Or", "Xor", "Mux"]
