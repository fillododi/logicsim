# Levels in unlock order. `parts` lists the chips each level may use.

# The tutorial: the guide bubbles in tutorial.toml walk through it. Not doesn't
# need it, so a player can skip straight to the gates. Wire teaches connections,
# Hello teaches parts.
[[level]]
name = "Wire"
group = "00_tutorial"
parts = []

[[level]]
name = "Hello"
group = "00_tutorial"
parts = ["Nand"]

[[level]]
name = "Not"
group = "01_gates"
parts = ["Nand"]

[[level]]
name = "And"
group = "01_gates"
parts = ["Nand", "Not"]

[[level]]
name = "Or"
group = "01_gates"
parts = ["Nand", "Not", "And"]

[[level]]
name = "Xor"
group = "01_gates"
parts = ["Nand", "Not", "And", "Or"]

[[level]]
name = "Mux"
group = "01_gates"
parts = ["Nand", "Not", "And", "Or", "Xor"]

[[level]]
name = "DMux"
group = "01_gates"
parts = ["Nand", "Not", "And", "Or", "Xor", "Mux"]

# Buses: the widths of the Intel 4004, 4-bit data, 8-bit instructions and register
# pairs, 12-bit addresses. Each level needs only the gate it widens, so a bus level
# opens as soon as that gate is solved.
[[level]]
name = "Not4"
group = "02_buses"
parts = ["Nand", "Not"]

[[level]]
name = "And4"
group = "02_buses"
parts = ["Nand", "And"]

[[level]]
name = "Or4"
group = "02_buses"
parts = ["Nand", "Or"]

[[level]]
name = "Xor4"
group = "02_buses"
parts = ["Nand", "Xor"]

[[level]]
name = "Mux4"
group = "02_buses"
parts = ["Nand", "Mux"]

[[level]]
name = "Mux8"
group = "02_buses"
parts = ["Nand", "Mux", "Mux4"]

[[level]]
name = "Mux12"
group = "02_buses"
parts = ["Nand", "Mux", "Mux4", "Mux8"]

[[level]]
name = "Or4Way"
group = "02_buses"
parts = ["Nand", "Or"]

[[level]]
name = "Mux4Way4"
group = "02_buses"
parts = ["Nand", "Mux4"]

[[level]]
name = "Mux8Way4"
group = "02_buses"
parts = ["Nand", "Mux4", "Mux4Way4"]

[[level]]
name = "Mux4Way12"
group = "02_buses"
parts = ["Nand", "Mux12"]

[[level]]
name = "DMux4Way"
group = "02_buses"
parts = ["Nand", "DMux"]

[[level]]
name = "DMux8Way"
group = "02_buses"
parts = ["Nand", "DMux", "DMux4Way"]

# Arithmetic: adders up to the 4004's 4-bit data and 12-bit program counter. The
# 4004's ALU comes after them, in its own levels.
[[level]]
name = "HalfAdder"
group = "03_arith"
parts = ["Nand", "Xor", "And"]

[[level]]
name = "FullAdder"
group = "03_arith"
parts = ["Nand", "HalfAdder", "Or"]

[[level]]
name = "Add4"
group = "03_arith"
parts = ["Nand", "FullAdder"]

[[level]]
name = "Inc4"
group = "03_arith"
parts = ["Nand", "HalfAdder"]

[[level]]
name = "Inc12"
group = "03_arith"
parts = ["Nand", "Add4"]

# The pieces of the 4004's ALU that aren't plain adders: SUB's inverted borrow,
# rotation through the carry, decimal adjust and the keyboard code.
[[level]]
name = "AddSub4"
group = "03_arith"
parts = ["Nand", "Add4", "Xor4", "Xor"]

[[level]]
name = "Rotate4"
group = "03_arith"
parts = ["Nand", "Mux", "Mux4"]

[[level]]
name = "Daa4"
group = "03_arith"
parts = ["Nand", "Add4", "And", "Or"]

[[level]]
name = "Kbp4"
group = "03_arith"
parts = ["Nand", "Not", "And", "Or"]

# The 4004's ALU: every accumulator operation, chosen by op. Ops 0-12 are the
# low digit of the instructions F0-FC, 13 is LD, 14 ADD and 15 SUB.
[[level]]
name = "ALU"
group = "03_arith"
parts = ["Nand", "Not", "Not4", "Or4Way", "Mux4", "Mux8Way4", "Add4", "AddSub4", "Rotate4", "Daa4", "Kbp4"]

# Memory, from NAND: two NANDs that read each other hold a bit (SRLatch), gating
# them gives a latch that follows its input while load is 1 (DLatch), and two
# latches opened by opposite clock phases make the flip-flop (DFF). A part named
# DFF then runs as the engine's DFF primitive, the same flip-flop, only faster.
[[level]]
name = "SRLatch"
group = "04_seq"
parts = ["Nand", "Not"]

[[level]]
name = "DLatch"
group = "04_seq"
parts = ["Nand", "Not", "And", "SRLatch"]

[[level]]
name = "DFF"
group = "04_seq"
parts = ["Nand", "Not", "DLatch"]

# The DFF holds a bit for one cycle, and a Mux in front of it keeps it for as
# long as load stays 0. Registers are Bits side by side.
[[level]]
name = "Bit"
group = "04_seq"
parts = ["Nand", "Mux", "DFF"]

[[level]]
name = "Register4"
group = "04_seq"
parts = ["Nand", "Bit"]

[[level]]
name = "Register8"
group = "04_seq"
parts = ["Nand", "Register4"]

[[level]]
name = "Register12"
group = "04_seq"
parts = ["Nand", "Register4", "Register8"]

# The 4004's 16 index registers, also used as 8 pairs. addr is an instruction's
# low digit: pair instructions ignore its bit 0.
[[level]]
name = "IndexRegs"
group = "04_seq"
parts = ["Nand", "Or", "DMux", "DMux8Way", "Mux4", "Mux8Way4", "Register4"]

# The 4004's program counter and address stack: four addresses and a 2-bit
# pointer that wraps, as on the chip, so a fourth nested call loses the oldest.
[[level]]
name = "PC"
group = "04_seq"
parts = ["Nand", "Not", "And", "Or", "Xor", "Mux", "Mux12", "DMux4Way", "Mux4Way12", "Inc12", "Register12", "Bit"]

# The CPU: the Intel 4004 with its own pins. Each instruction cycle is 8 clock periods,
# A1 A2 A3 (address out), M1 M2 (instruction in), X1 X2 X3 (execute).
[[level]]
name = "Timing"
group = "05_cpu"
parts = ["Nand", "Not", "And", "Mux", "Mux4", "Inc4", "Bit", "Register4"]

# The computer around the CPU, which reaches its data memory through RAM pins.
# Data memory comes in 4-bit characters, up to eight banks of four 4002 chips. A
# 4002 has 4 registers of 16 main and 4 status characters; SRC's 8-bit address
# picks the chip, the register and the main character, and DCL picks the bank.
# The CPU level goes between PC and RAM8, and the program ROM after DataRAM.
[[level]]
name = "RAM8"
group = "06_computer"
parts = ["Nand", "DMux8Way", "Mux8Way4", "Register4"]

[[level]]
name = "RAM64"
group = "06_computer"
parts = ["Nand", "DMux8Way", "Mux8Way4", "RAM8"]

[[level]]
name = "RAM4002"
group = "06_computer"
parts = ["Nand", "DMux", "Mux4", "RAM8", "RAM64"]

[[level]]
name = "RAMBank"
group = "06_computer"
parts = ["Nand", "DMux4Way", "Mux4Way4", "RAM4002"]

[[level]]
name = "DataRAM"
group = "06_computer"
parts = ["Nand", "DMux8Way", "Mux8Way4", "RAMBank"]
