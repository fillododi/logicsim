# The guided tour: bubbles shown in order, one at a time. Each step:
#
#   id      unique name; tutorial.json remembers which ids the player has seen
#   level   optional: the step only shows (and waits) while this level is open
#   anchor  what the bubble points at (see docs/decisions.md for the list):
#             levels, level:<Name>, brief, editor, line:<text>, canvas,
#             pin:<name>, part, wire (the first part-to-part wire), header,
#             run_button, results, footer, chips (the "Your chips" list),
#             clock (the clock panel, once the chip has a DFF or reads clock)
#   until   the player action that completes the step:
#             next (the bubble's Next button), save, build_ok, toggle,
#             set_value (an input's value typed in; it counts as a toggle too),
#             open_part, up, run_tests, solved, open_level, open_level:<Name>,
#             export (a chip exported from the Esc menu),
#             clock_step (one cycle run with Step or Space)
#   text    what the bubble says; blank lines split paragraphs, and lines
#           indented by four spaces are shown as code
#
# The player can skip the tour from any bubble, and F1 replays it from the start.

[[step]]
id = "welcome"
level = "Wire"
anchor = "levels"
until = "next"
text = """
Welcome to NAND Sim! Starting from a single kind of gate, the Nand, you will build the Intel 4004: the first microprocessor sold on a single chip, made in 1971 for the Busicom 141-PF calculator. Then you will build the chips of the computer around it, its RAM and ROM, until the 4004 runs real programs.

Each entry in this list is a chip to build. Solving one unlocks the chips that use it. The groups follow the climb: gates, buses, arithmetic, memory, the 4004, then one group per chip of its computer. Click a group's name to fold it away or open it again.
"""

[[step]]
id = "brief"
level = "Wire"
anchor = "brief"
until = "next"
text = """
The brief says what this level's chip must do: its truth table, the parts you may use, and a hint.
"""

[[step]]
id = "connect"
level = "Wire"
anchor = "line:PARTS:"
until = "build_ok"
text = """
You build chips by writing HDL here. Under the PARTS: line you connect signals. A connection joins two signals directly, like a wire: the left side always takes the value of the right side.

Click at the end of the PARTS: line, press Enter and type:

    out = in;

Then press Ctrl+S to save and build the chip.
"""

[[step]]
id = "circuit"
level = "Wire"
anchor = "canvas"
until = "next"
text = """
This is your chip's circuit, drawn from what you wrote: inputs on the left, outputs on the right, and here one wire between them.
"""

[[step]]
id = "toggle"
level = "Wire"
anchor = "pin:in"
until = "toggle"
text = """
Click the input to flip it between 0 and 1. Green wires carry a 1, grey wires a 0. The output follows: they are the same wire.
"""

[[step]]
id = "run"
level = "Wire"
anchor = "run_button"
until = "solved"
text = """
When the chip looks right, run the level's tests (or press Ctrl+Enter). They try every row of the brief's table.
"""

[[step]]
id = "to_hello"
level = "Wire"
anchor = "level:Hello"
until = "open_level:Hello"
text = """
Level solved! Solved levels get a ✓. Now open Hello: a wire only passes a signal along, Hello computes something.
"""

[[step]]
id = "nand"
level = "Hello"
anchor = "brief"
until = "next"
text = """
To compute, a chip needs parts: other chips used inside it. The only one you start with is the Nand. Its output is 0 only when both its inputs are 1.

The Nand is universal: every logic function, and so every computer, can be built from Nands alone. That is the whole game.
"""

[[step]]
id = "write"
level = "Hello"
anchor = "line:PARTS:"
until = "build_ok"
text = """
A part is written Chip(pin=signal, ...). Each pin=signal is a connection: the Nand's own pin on the left, a signal of your chip on the right. Under PARTS:, type:

    Nand(a=a, b=b, out=out);

Then press Ctrl+S.
"""

[[step]]
id = "output"
level = "Hello"
anchor = "pin:out"
until = "next"
text = """
Now the output is computed: click a and b and watch it. It is 0 only when a and b are both 1, as in the brief.
"""

[[step]]
id = "type_value"
level = "Hello"
anchor = "pin:b"
until = "set_value"
text = """
You can also type an input's value. Click an empty spot of the circuit, so your keys go to it rather than to the editor. Then point at b, type 1 and press Enter.

For one bit a click is quicker, but later chips have buses of up to 12 bits, and typing 0xABC beats clicking 2748 times. Values are written as in the tests: 13, 0b1101 or 0xD.
"""

[[step]]
id = "run_hello"
level = "Hello"
anchor = "run_button"
until = "solved"
text = """
Run the tests to solve the level.
"""

[[step]]
id = "unlocked"
level = "Hello"
anchor = "level:Not"
until = "open_level:Not"
text = """
Solved! Now open Not, the first real gate.
"""

[[step]]
id = "gates"
level = "Not"
anchor = "levels"
until = "next"
text = """
Gates. A gate computes one bit from one or two bits: Not, And, Or, Xor, and the selectors Mux and DMux. They are the vocabulary of every digital circuit.

The 4004 packs about 2,300 transistors, and logically all of them come down to gates like these. Every "if" in the CPU is a Mux, every "when this and that" an And.
"""

[[step]]
id = "on_your_own"
level = "Not"
anchor = "brief"
until = "next"
text = """
From here on there is no step-by-step: read the brief, try something, run the tests.

When a check fails, the results list the inputs, what was expected and what your chip gave.
"""

[[step]]
id = "replay"
level = "Not"
anchor = "footer"
until = "next"
text = """
Press F1 at any time to replay this tour.
"""

[[step]]
id = "wires"
level = "And"
anchor = "line:PARTS:"
until = "build_ok"
text = """
And needs two parts in a row: the output of one becomes the input of the next. To connect them, give the first part's output a name of your own, a wire, and use that name as an input of the second part:

    Not(in=a, out=na);
    Not(in=na, out=out);

Here the wire na carries the first Not's output into the second Not, so out is a again. Build your And with a wire like this, then press Ctrl+S.
"""

[[step]]
id = "see_wire"
level = "And"
anchor = "wire"
until = "next"
text = """
Your wire is drawn from one part to the other. Point at it to see its name and value: the whole wire lights up. Click a and b and watch the value pass through it.
"""

[[step]]
id = "open_part"
level = "And"
anchor = "part"
until = "open_part"
text = """
Your And uses your own Not as a part. Click the Not to look inside it: it is the chip you wrote.
"""

[[step]]
id = "back_up"
level = "And"
anchor = "header"
until = "up"
text = """
The breadcrumbs show where you are. Click And, or press Backspace, to go back up.
"""

[[step]]
id = "export"
level = "And"
anchor = "footer"
until = "export"
text = """
Any chip you build can become a part of your own, usable in every level. Press Esc, choose Export this chip as…, keep the name MyAnd or type another, and press Enter.
"""

[[step]]
id = "your_chips"
level = "And"
anchor = "chips"
until = "next"
text = """
Your chips are listed here. Use one like any other part, MyAnd(a=..., b=..., out=...), and the × deletes it.

They are .hdl files in the save-exports folder next to your saves. To use a chip someone shares with you, copy its file there.
"""

[[step]]
id = "done"
level = "And"
anchor = "levels"
until = "next"
text = """
That's the tour for now. Each new group opens with a bubble on what it adds to the 4004, and the clock gets its own when you reach Memory. Good luck!
"""

# One bubble at the first level of each group: what the group builds and where it
# goes in the 4004 or its computer.
[[step]]
id = "buses"
level = "Not4"
anchor = "levels"
until = "next"
text = """
Buses. The 4004 is a 4-bit CPU: it computes on 4-bit numbers, enough for one decimal digit, which suited a calculator. Its instructions are 8 bits, and its program addresses are 12 bits, enough for 4096 bytes of ROM.

A bus carries such a number as one wire per bit under one name. This group widens your gates to 4, 8 and 12 bits.
"""

[[step]]
id = "arith"
level = "HalfAdder"
anchor = "levels"
until = "next"
text = """
Arithmetic. Computers add as you learned on paper, column by column, with a carry passed to the next column. In binary each column holds 0 or 1, so a column is a few gates.

This group climbs from one column to the 4004's ALU, the unit that adds, subtracts, rotates and corrects decimal digits, and sets the carry flag that conditional jumps test.
"""

# Memory: SRLatch is the first chip whose wires feed back, and DFF the first that
# reads the clock, so it introduces the clock panel.
[[step]]
id = "seq"
level = "SRLatch"
anchor = "levels"
until = "next"
text = """
Memory. So far every output depends only on the inputs right now. A computer must also remember: the number it is adding, its registers, where it is in the program.

Here you make memory from Nands and a clock, up to the 4004's own: its 16 index registers of 4 bits, and its program counter with a stack of 3 return addresses.
"""

[[step]]
id = "memory"
level = "SRLatch"
anchor = "brief"
until = "build_ok"
text = """
SRLatch is your first chip with memory. Its wires feed back into the parts that drive them, and that loop is what holds the bit. Build it and press Ctrl+S.
"""

[[step]]
id = "flipflop"
level = "DFF"
anchor = "brief"
until = "build_ok"
text = """
The DFF is the first chip that reads the clock: write clock wherever a part takes a signal, like true or false. Build a DFF and press Ctrl+S.
"""

[[step]]
id = "clock"
level = "DFF"
anchor = "clock"
until = "clock_step"
text = """
A chip that reads the clock gets a clock panel. Set in, then click Step: one cycle runs, a tick and a tock, and out shows what in was at the tick. Space steps too, once you have clicked the circuit.

Run plays cycles by itself at the speed beside it, and Reset forgets every stored bit.
"""

# The 4004 and its computer: one group per chip of the MCS-4 family.
[[step]]
id = "cpu"
level = "Timing"
anchor = "levels"
until = "next"
text = """
The CPU: the Intel 4004. Like the real chip, yours has 16 pins and reaches its program and data only through a 4-bit bus. Every instruction takes 8 clock periods: 3 to send the address, 2 to read the instruction, 3 to execute it.

First you build the units, each doing one job at its moment. Then the CPU level wires them into the 4004.
"""

[[step]]
id = "ram"
level = "RAM8"
anchor = "levels"
until = "next"
text = """
The 4004 is solved! Now the computer around it, one group per chip of Intel's MCS-4 family: the 4002 RAM here, then the 4001 program ROM.

A 4002 holds 80 characters of 4 bits: 4 registers of 16 main and 4 status characters. You build it up from eight cells, then group up to 32 chips into the 4004's data memory.
"""
