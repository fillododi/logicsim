# Runs the /verify gate on every PR and on main, so main is always green.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Levels against reference
        run: uv run nandsim test
      - name: Installed wheel finds its levels
        run: |
          uv build
          cd "$(mktemp -d)"
          uvx --from "$GITHUB_WORKSPACE"/dist/nandsim-*.whl nandsim test
